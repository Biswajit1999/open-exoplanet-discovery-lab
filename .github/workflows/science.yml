name: science-validation

on:
  push:
    paths:
      - "src/exolab/**"
      - "scripts/run_synthetic_validation.py"
      - ".github/workflows/science.yml"
  pull_request:
    paths:
      - "src/exolab/**"
      - "scripts/run_synthetic_validation.py"
      - ".github/workflows/science.yml"

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[test]
      - run: python scripts/run_synthetic_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-science-validation
          path: outputs/validation/synthetic_validation.json
