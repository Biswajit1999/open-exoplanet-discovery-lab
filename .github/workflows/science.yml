name: science-validation

on:
  push:
    paths:
      - "src/exolab/**"
      - "scripts/**"
      - "configs/**"
      - ".github/workflows/science.yml"
  pull_request:
    paths:
      - "src/exolab/**"
      - "scripts/**"
      - "configs/**"
      - ".github/workflows/science.yml"

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[test]
      - run: python scripts/run_synthetic_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-science-validation
          path: outputs/validation/synthetic_validation.json

  nets3-live-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[test]
      - run: python scripts/build_nets_manifest.py
      - run: python scripts/run_nets_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nets3-live-smoke
          path: |
            data/manifests/nets3.json
            outputs/nets3/
          if-no-files-found: ignore
