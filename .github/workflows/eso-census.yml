name: eso-census

on:
  pull_request:
    paths:
      - "scripts/build_eso_overlap_census.py"
      - "src/exolab/eso.py"
      - "src/exolab/chromatic.py"
      - ".github/workflows/eso-census.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-overlap-census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python scripts/build_eso_overlap_census.py --output outputs/eso_overlap_census --workers 6
      - uses: actions/upload-artifact@v4
        with:
          name: eso-nirps-harps-overlap
          path: outputs/eso_overlap_census/
